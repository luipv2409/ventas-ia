services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ventas_ia_app
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8085}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ventas_ia}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-rootpassword}
      DB_CHARSET: utf8mb4
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: ventas_ia_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-ventas_ia}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./database/ventas_ia.sql:/docker-entrypoint-initdb.d/01-ventas_ia.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  pma:
    image: phpmyadmin:latest
    container_name: ventas_ia_pma
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8082}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-rootpassword}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
