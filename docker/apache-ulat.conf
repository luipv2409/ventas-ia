# Hardening de Apache para Portal & Chatbot ULAT (Defensa en Profundidad)
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Bloqueo explícito a nivel servidor de directorios internos de negocio/datos
<DirectoryMatch "^/var/www/html/(config|services|database|storage|knowledge|scripts|tests|data|integraciones|docker|legacy-ecommerce)(/|$)">
    Require all denied
</DirectoryMatch>

# Bloqueo explícito de archivos ocultos (.env, .git) y extensiones internas
<FilesMatch "(^\.|^composer\.(json|lock)$|^API KEYS|\.(md|markdown|sql|log|bak|old|orig|swp|yml|yaml|ini|sh|bat|ps1)$)">
    Require all denied
</FilesMatch>
